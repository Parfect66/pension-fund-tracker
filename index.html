<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pension Fund Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
  <h1>Pension Fund Tracker</h1>
  <p class="subtitle">Scottish Widows pension fund holdings – live stock performance tracking</p>

  <div class="controls">
    <button onclick="refreshAll()">Refresh Data</button>
    <button onclick="testApiKeys()">Test API</button>
    <span id="lastUpdated" class="timestamp"></span>
  </div>

  <div id="errorBox" class="error-box"></div>

  <div class="portfolio-summary">
    <div class="portfolio-row">
      <span class="portfolio-label">Total Portfolio</span>
      <span class="portfolio-value" id="totalValue">£0</span>
    </div>
    <div id="portfolioFundRows"></div>
    <div class="portfolio-hint">Click any fund value to edit. Daily change applied at 09:10 UK time.</div>
  </div>

  <div class="dashboard-grid" id="dashboardGrid"></div>

  <div id="apiStatus"></div>
</div>

<script type="module" src="app.mjs"></script>
</body>
</html>
